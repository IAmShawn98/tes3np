name: Bug report
description: Report a launcher problem with steps to reproduce it.
labels: ["bug"]
body:
  - type: input
    id: build
    attributes:
      label: TES3NP version
      placeholder: v0.1.21-alpha
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Install or update
        - Characters or login
        - Game Chat or Happy Hour
        - Expansion Pack
        - Macros
        - Game Client Settings
        - Display or accessibility
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and game client
      placeholder: Windows 11, bundled TES3MP client
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include whether this was a fresh install or an upgrade when relevant.
      placeholder: "1. Open the launcher..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted screenshot or log excerpt
      description: Share only the relevant lines. Remove names, paths and sign-in details. Keep character exports, settings.ini, raw chat archives and import journals private.
