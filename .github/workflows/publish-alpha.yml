name: Publish Alpha

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of the reviewed GitHub release draft (for example, v0.1.21-alpha)
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the exact Windows ZIP that passed release testing
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  publish-alpha:
    if: github.repository == 'IAmShawn98/tes3np' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release evidence and active-only Happy Hour
        run: python scripts/check-release-gates.py

      - name: Validate source and checked-in payload
        run: python scripts/project.py check

      - name: Parse PowerShell helpers
        shell: powershell
        run: ./scripts/check-powershell.ps1

      - name: Test launcher updater validation
        shell: pwsh
        run: ./scripts/test-update-client.ps1

      - name: Test updater transaction and rollback
        shell: pwsh
        run: ./scripts/test-updater-transaction.ps1

      - name: Test update metadata generation
        shell: pwsh
        run: ./scripts/test-update-metadata.ps1

      - name: Publish the reviewed draft and then the alpha feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TES3NP_RELEASE_TAG: ${{ inputs.tag }}
          TES3NP_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: ./scripts/publish-alpha.ps1 -Tag $env:TES3NP_RELEASE_TAG -CandidateSha256 $env:TES3NP_CANDIDATE_SHA256
