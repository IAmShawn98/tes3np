name: Publish Alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release evidence and disable development-only previews
        run: python scripts/check-release-gates.py

      - name: Require source-built client inputs before compiling
        shell: pwsh
        run: |
          if (!$env:TES3NP_MARKERLESS_CONSOLE_EXE -or !$env:TES3NP_MARKERLESS_CONSOLE_DLLS) {
            throw 'This workflow needs the playtested local client payload. Use the verified local release candidate for publication.'
          }

      - name: Validate complete source and payload
        run: python scripts/project.py check

      - name: Parse PowerShell helpers
        shell: powershell
        run: ./scripts/check-powershell.ps1

      - name: Test launcher updater validation
        shell: pwsh
        run: ./scripts/test-update-client.ps1

      - name: Test updater transaction and rollback
        shell: pwsh
        run: ./scripts/test-updater-transaction.ps1

      - name: Compile launcher with custom icon and package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build-windows.ps1

      - name: Generate and verify update metadata
        shell: pwsh
        run: |
          python scripts/check-windows-package.py dist/tes3np-windows.zip --require-console-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/generate-update-metadata.ps1

      - name: Test updater metadata failure handling
        shell: pwsh
        run: ./scripts/test-update-metadata.ps1

      - name: Upload private CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tes3np-alpha-candidate
          path: |
            dist/tes3np-windows.zip
            dist/tes3np-windows.zip.sha256
            dist/tes3np-update.json
          if-no-files-found: error

      - name: Publish latest alpha only after all validation passes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'RELEASE_PUBLISH_TOKEN is not configured.' }
          $repo = 'IAmShawn98/tes3np-releases'
          $tag = 'latest-alpha'
          $manifest = Get-Content 'dist/tes3np-update.json' -Raw | ConvertFrom-Json
          $version = $manifest.version
          if (-not $version) { throw 'Generated update manifest has no version.' }

          # Keep the legacy filenames as stable updater endpoints. Existing installed
          # launchers depend on them. Add versioned copies for human downloads.
          $versionedPackage = "dist/tes3np-v$version-windows.zip"
          $versionedChecksum = "$versionedPackage.sha256"
          Copy-Item 'dist/tes3np-windows.zip' $versionedPackage -Force
          $hash = (Get-FileHash -LiteralPath $versionedPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($versionedChecksum, "$hash  tes3np-v$version-windows.zip`n", (New-Object Text.UTF8Encoding($false)))

          $assets = @(
            'dist/tes3np-windows.zip',
            'dist/tes3np-windows.zip.sha256',
            'dist/tes3np-update.json',
            $versionedPackage,
            $versionedChecksum
          )
          foreach ($asset in $assets) { if (-not (Test-Path -LiteralPath $asset)) { throw "Release asset is missing: $asset" } }
          $playerNotes = Get-Content -LiteralPath 'RELEASE_NOTES.md' -Raw -Encoding UTF8
          $versionPattern = [regex]::Escape($version)
          $section = [regex]::Match($playerNotes, "(?ms)^##[ \t]+v$versionPattern(?=[ \t]|\r?$)[^\r\n]*\r?\n(.*?)(?=^##[ \t]|\z)")
          $notes = $section.Groups[1].Value.Trim()
          if (-not $notes) { throw "No RELEASE_NOTES.md content found for v$version." }
          $releaseDate = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          $notes = "## v$version — $releaseDate`n`n$notes"
          $notesFile = Join-Path $env:RUNNER_TEMP "tes3np-v$version-release-notes.md"
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))
          $old = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $repo *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $old
          if ($releaseExists) {
            foreach ($asset in $assets | Where-Object { $_ -ne 'dist/tes3np-update.json' }) {
              gh release upload $tag $asset --repo $repo --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload release asset: $asset" }
            }
            gh release edit $tag --repo $repo --title "tes3np v$version - Latest Test Build" --notes-file $notesFile --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish alpha release notes.' }
            # The manifest announces the new version to launchers. Replace it
            # after its package and changelog are both available.
            gh release upload $tag 'dist/tes3np-update.json' --repo $repo --clobber
          } else {
            gh release create $tag @assets --repo $repo --title "tes3np v$version - Latest Test Build" --notes-file $notesFile --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish alpha release.' }

          # Keep the public README download example synchronized with the release.
          $readmeJson = gh api "repos/$repo/contents/README.md" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read public README.' }
          $readmeText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($readmeJson.content -replace '\\s', '')))
          $versionedName = "tes3np-v$version-windows.zip"
          $updatedReadme = [regex]::Replace(
            $readmeText,
            'tes3np-v[^\x60\s]+-windows\.zip',
            $versionedName
          )
          if ($updatedReadme -ne $readmeText) {
            $encodedReadme = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($updatedReadme))
            $payload = @{
              message = "Update README for v$version"
              content = $encodedReadme
              sha = $readmeJson.sha
            } | ConvertTo-Json
            $payload | gh api --method PUT "repos/$repo/contents/README.md" --input -
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update public README version.' }
          }

      - name: Verify published manifest and package are reachable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/IAmShawn98/tes3np-releases/releases/download/latest-alpha'
          $published = Invoke-RestMethod "$base/tes3np-update.json" -Headers @{ 'User-Agent' = 'tes3np-release-verifier' }
          $local = Get-Content 'dist/tes3np-update.json' -Raw | ConvertFrom-Json
          if ($published.version -ne $local.version) { throw 'Published manifest version does not match candidate.' }
          if ($published.package.sha256 -ne $local.package.sha256) { throw 'Published manifest hash does not match candidate.' }
          $legacyHead = Invoke-WebRequest "$base/tes3np-windows.zip" -Method Head -Headers @{ 'User-Agent' = 'tes3np-release-verifier' }
          if ($legacyHead.StatusCode -ne 200) { throw 'Stable updater package is not reachable.' }
          $versionedName = "tes3np-v$($published.version)-windows.zip"
          $versionedHead = Invoke-WebRequest "$base/$versionedName" -Method Head -Headers @{ 'User-Agent' = 'tes3np-release-verifier' }
          if ($versionedHead.StatusCode -ne 200) { throw 'Versioned Windows download is not reachable.' }
          Write-Host "Published alpha verified: v$($published.version)"
