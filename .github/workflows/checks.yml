name: Static and PowerShell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize patch script final newline
        shell: pwsh
        run: |
          $path = 'scripts/patch-tes3mp.ps1'
          $text = [IO.File]::ReadAllText($path)
          if (-not ($text.EndsWith("`n"))) {
            [IO.File]::WriteAllText($path, $text + "`n", (New-Object Text.UTF8Encoding($true)))
          }
      - name: Check source and available patch payload
        run: python scripts/project.py check --allow-missing-payload
      - name: Parse workers with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/check-powershell.ps1
      - name: Guard Chat Host persistence and Happy Hour contracts
        run: python scripts/check-chat-architecture.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows Chat Host
        run: dotnet build chat-host/tes3np.ChatHost.csproj -c Release -r win-x64 --no-self-contained
