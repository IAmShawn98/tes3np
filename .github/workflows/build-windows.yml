name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize patch script final newline
        shell: pwsh
        run: |
          $path = 'scripts/patch-tes3mp.ps1'
          $text = [IO.File]::ReadAllText($path)
          if (-not ($text.EndsWith("`n"))) {
            [IO.File]::WriteAllText($path, $text + "`n", (New-Object Text.UTF8Encoding($true)))
          }
      - name: Validate complete source and payload
        run: python scripts/project.py check
      - name: Parse PowerShell helpers
        shell: powershell
        run: ./scripts/check-powershell.ps1
      - name: Compile launcher with custom icon and package
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tes3np-windows
          path: dist/tes3np-windows.zip
          if-no-files-found: error
      - name: Publish latest public test build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'RELEASE_PUBLISH_TOKEN is not configured.' }
          $repo = 'IAmShawn98/tes3np-releases'
          $tag = 'latest-alpha'
          $asset = 'dist/tes3np-windows.zip'
          $notes = @"
          Automated tes3np development build from the private source repository.

          Version: v0.1.2-alpha
          Source revision: $env:GITHUB_SHA

          Changes in v0.1.2-alpha:
          - Added a permanent Check for Updates button to the launcher.
          - The launcher can check the official public tes3np release and report whether a newer version is available.
          - The update button uses the same visual style and hover/pressed behavior as the rest of the launcher.
          - Updated the displayed launcher version to v0.1.2-alpha.

          This is development software intended for testing. Extract the ZIP completely and run tes3np.exe from the included tes3np folder.
          "@

          $releaseExists = $false
          $oldNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          $PSNativeCommandUseErrorActionPreference = $oldNativePreference

          if ($releaseExists) {
            gh release upload $tag $asset --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload the public release package.' }
            gh release edit $tag --repo $repo --title 'tes3np v0.1.2-alpha - Latest Test Build' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the public release.' }
          }
          else {
            gh release create $tag $asset --repo $repo --title 'tes3np v0.1.2-alpha - Latest Test Build' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the public release. Check RELEASE_PUBLISH_TOKEN permissions.' }
          }
