name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/safe-auto-updater
      - Update/v0.1.21-alpha

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize patch script final newline
        shell: pwsh
        run: |
          $path = 'scripts/patch-tes3mp.ps1'
          $text = [IO.File]::ReadAllText($path)
          if (-not ($text.EndsWith("`n"))) { [IO.File]::WriteAllText($path, $text + "`n", (New-Object Text.UTF8Encoding($true))) }
      - name: Validate complete source and payload
        run: python scripts/project.py check
      - name: Parse PowerShell helpers
        shell: powershell
        run: ./scripts/check-powershell.ps1
      - name: Test launcher updater validation
        shell: pwsh
        run: ./scripts/test-update-client.ps1
      - name: Test updater transaction and rollback
        shell: pwsh
        run: ./scripts/test-updater-transaction.ps1
      - name: Compile launcher with custom icon and package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build-windows.ps1
      - name: Verify final packaged Windows ZIP
        run: python scripts/check-windows-package.py dist/tes3np-windows.zip
      - name: Generate and verify update metadata
        shell: pwsh
        run: ./scripts/generate-update-metadata.ps1
      - name: Test updater metadata failure handling
        shell: pwsh
        run: ./scripts/test-update-metadata.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tes3np-windows
          path: |
            dist/tes3np-windows.zip
            dist/tes3np-windows.zip.sha256
            dist/tes3np-update.json
          if-no-files-found: error
