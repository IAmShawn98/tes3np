name: Experimental markerless TES3MP Windows build

on:
  push:
    branches:
      - research/markerless-windows-build
    paths:
      - '.github/workflows/markerless-windows.yml'
      - 'research/markerless/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/research/markerless-windows-build'
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare CMake and 7-Zip
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:ProgramFiles '7-Zip') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build stock and markerless TES3MP 0.8.1
        id: clients
        shell: pwsh
        run: ./research/markerless/build-markerless.ps1
      - name: Save the test ZIP to the private test output branch
        shell: pwsh
        env:
          TEST_OUTPUT_DIR: ${{ steps.clients.outputs.directory }}
          TEST_OUTPUT_BRANCH: research/markerless-windows-test-output
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $zipName = 'TES3MP-0.8.1-markerless-Windows-test.zip'
          $staging = Join-Path $env:RUNNER_TEMP 'markerless-test-output'
          git fetch origin "refs/heads/$env:TEST_OUTPUT_BRANCH"
          git worktree add --detach $staging FETCH_HEAD
          $zip = Join-Path $staging $zipName
          Compress-Archive -Path (Join-Path $env:TEST_OUTPUT_DIR '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath "$zip.sha256" -Encoding ASCII
          git -C $staging add -- $zipName "$zipName.sha256"
          git -C $staging -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -m "Save markerless test build from $env:GITHUB_SHA"
          git -C $staging push origin "HEAD:refs/heads/$env:TEST_OUTPUT_BRANCH"
          Write-Host "Test ZIP SHA-256: $hash"
